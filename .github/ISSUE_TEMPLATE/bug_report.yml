name: 🐛 Bug Report
description: Create a report to help us fix a bug in PromptForge
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: dropdown
    id: platform
    attributes:
      label: Target AI Platform
      description: Where did the bug occur?
      options:
        - Claude.ai
        - ChatGPT (chatgpt.com)
        - Microsoft Copilot
        - Google Gemini
        - Perplexity.ai
        - Options / Popup UI
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Google Chrome
        - Brave
        - Microsoft Edge
        - Arc
        - Other Chromium
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open Claude.ai
        2. Type 'test prompt'
        3. Press Alt + P
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true
