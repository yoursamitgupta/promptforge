name: 💡 Feature Request
description: Suggest an idea or new AI platform integration for PromptForge
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping shape the future of PromptForge!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Enhancement
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other alternative solutions or features you considered?
